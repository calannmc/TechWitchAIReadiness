<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CX AI Fit Assessment</title>
<meta name="description" content="A fit-before-you-buy assessment for contact centre AI platforms: questionnaire, intents, readiness, fit matrix, results and a PDF report.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="topbar">
  <div class="brand"><small id="brandLine">Innovation Hub · v1</small><h1>CX AI Fit Assessment</h1></div>
  <div class="controls">
    <select id="picker" aria-label="Saved assessments"></select>
    <button id="btnNew">New</button>
    <button id="btnSave" class="primary">Save</button>
    <button id="btnDelete" class="quiet" title="Delete this saved assessment">Delete</button>
    <button id="btnExport" title="Export this assessment as JSON">Export</button>
    <button id="btnImport" title="Import an assessment JSON file">Import</button>
    <input type="file" id="fileImport" class="hidden-file" accept="application/json,.json">
    <button id="btnTheme" class="quiet" title="Switch light and dark">Theme</button>
    <span id="statusChip" class="chip neutral">Loading</span>
  </div>
</div>
<div class="tabs" role="tablist" id="tabs"></div>
<main id="main"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog class="modal" id="confirm"><p id="confirmText"></p><div class="actions"><button id="confirmNo">Cancel</button><button id="confirmYes" class="primary">Confirm</button></div></dialog>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
